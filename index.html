<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Lift Bridge Marine Detailing Pipeline</title> <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet"> <style> body { font-family: 'Roboto', sans-serif; margin: 0; background: url('https://images.unsplash.com/photo-1625237734418-6e1b63d72a3c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed; background-size: cover; color: #ffffff; overflow-x: hidden; position: relative; } body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(26, 60, 94, 0.8), rgba(74, 111, 158, 0.3)); z-index: -1; } .header { padding: 15px 30px; background: rgba(26, 60, 94, 0.8); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; } .header .company-name { font-size: 20px; font-weight: 600; margin: 0; } .header .pipeline-total { font-size: 18px; font-weight: 500; margin: 0; } .header .add-client-btn { background: linear-gradient(90deg, #4a6f9e, #2a5a8e); border: none; padding: 8px 16px; border-radius: 20px; color: #ffffff; cursor: pointer; transition: transform 0.3s; } .header .add-client-btn:hover { transform: scale(1.05); } .controls { display: flex; justify-content: flex-end; padding: 15px 30px; } .sort-btn { background: linear-gradient(90deg, #4a6f9e, #2a5a8e); border: none; padding: 8px 16px; border-radius: 20px; color: #ffffff; cursor: pointer; transition: transform 0.3s; } .sort-btn:hover { transform: scale(1.05); } .pipeline { display: flex; gap: 15px; padding: 15px 30px; overflow-x: auto; position: relative; } .pipeline::-webkit-scrollbar { height: 8px; } .pipeline::-webkit-scrollbar-thumb { background: #4a6f9e; border-radius: 4px; } .stage { flex: 1; min-width: 280px; background: linear-gradient(135deg, #1a3c5e, #4a6f9e); padding: 15px; border-radius: 12px; backdrop-filter: blur(5px); } .stage-header { background: linear-gradient(90deg, #4a6f9e, #2a5a8e); padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 0 10px rgba(255, 255, 255, 0.2); } .stage-header h2 { margin: 0; font-size: 18px; font-weight: 600; color: #ffffff; } .stage-header span { font-size: 14px; color: rgba(255, 255, 255, 0.8); } .wave-icon::before { content: '🌊'; margin-right: 5px; } .card { background: rgba(255, 255, 255, 0.95); padding: 10px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); border: 1px solid rgba(74, 111, 158, 0.5); opacity: 0; transform: translateY(10px); animation: fadeInUp 0.4s forwards; display: flex; flex-direction: column; gap: 5px; backdrop-filter: blur(5px); transition: transform 0.2s ease, box-shadow 0.2s ease; } @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } } .card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); } .card h3 { margin: 0; font-size: 14px; font-weight: 500; color: #1a3c5e; display: flex; align-items: center; gap: 5px; cursor: pointer; } .card h3::before { content: '🚤'; font-size: 12px; } .card .amount { font-size: 12px; font-weight: 600; color: #28a745; margin: 0; } .card-actions { display: flex; justify-content: space-between; margin-top: 5px; } .card-actions button { padding: 4px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; background: linear-gradient(90deg, #4a6f9e, #2a5a8e); color: white; border: none; transition: background 0.2s, opacity 0.2s; } .card-actions button:disabled { opacity: 0.5; cursor: not-allowed; } .card-actions button:hover:not(:disabled) { background: linear-gradient(90deg, #2a5a8e, #4a6f9e); } .dropzone { min-height: 50px; } .input-group { margin: 15px 30px; display: flex; flex-wrap: wrap; gap: 15px; background: rgba(255, 255, 255, 0.9); padding: 20px; border-radius: 12px; font-family: 'Roboto', sans-serif; font-size: 16px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); } input, select, textarea { padding: 8px; margin-right: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Roboto', sans-serif; font-size: 16px; background: #f8f9fa; } textarea { width: 100%; max-width: 300px; height: 60px; } button { padding: 8px 16px; border-radius: 6px; cursor: pointer; background: linear-gradient(90deg, #4a6f9e, #2a5a8e); color: white; border: none; transition: background 0.3s; } button:hover { background: linear-gradient(90deg, #2a5a8e, #4a6f9e); } .sidebar { position: fixed; top: 0; right: 0; width: 400px; height: 100%; background: linear-gradient(135deg, rgba(26, 60, 94, 0.8), rgba(74, 111, 158, 0.5)); backdrop-filter: blur(10px); box-shadow: -2px 0 5px rgba(0, 0, 0, 0.3); padding: 20px; color: #ffffff; overflow-y: auto; z-index: 10; display: none; opacity: 0; transform: scale(0.95); transform-origin: top right; transition: opacity 0.3s ease, transform 0.3s ease; } .sidebar.open { display: block; opacity: 1; transform: scale(1); } .sidebar.closing { opacity: 0; transform: scale(0.95); } .sidebar textarea, .sidebar input { width: 100%; margin-top: 5px; background: rgba(255, 255, 255, 0.2); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.3); } .sidebar-header { display: flex; align-items: center; gap: 10px; } .back-arrow { cursor: pointer; font-size: 20px; color: #ffffff; transition: transform 0.3s; } .back-arrow:hover { transform: translateX(-5px); } .close-btn { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 20px; color: #ffffff; } .photo-gallery { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; } .photo-gallery img { width: 100px; height: 100px; object-fit: cover; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.3); } </style> </head> <body> <div class="header"> <h1 class="company-name">Lift Bridge Marine Detailing</h1> <button id="addClientHeaderBtn" class="add-client-btn">Add Client</button> <h1 class="pipeline-total">Total Pipeline (Scheduling+): <span id="totalPipeline">$0.00</span></h1> </div> <div class="controls"> <button class="sort-btn">Sort by Name</button> </div> <div class="input-group" id="inputForm"> <input type="text" id="firstName" placeholder="First Name" required> <input type="text" id="lastName" placeholder="Last Name" required> <input type="text" id="boat" placeholder="Boat Make/Model" required> <input type="date" id="dateScheduled" placeholder="Date Scheduled"> <textarea id="service" placeholder="Service Requested/Performed"></textarea> <textarea id="notes" placeholder="General Notes"></textarea> <input type="number" id="amount" placeholder="Amount" step="0.01" min="0"> <select id="paymentMethod"> <option value="">Method of Payment</option> <option value="Cash">Cash</option> <option value="Credit Card">Credit Card</option> <option value="Check">Check</option> <option value="Online">Online</option> </select> <select id="status"> <option value="New">New</option> <option value="Quoted">Quoted</option> <option value="Scheduling">Scheduling</option> <option value="Scheduled">Scheduled</option> <option value="Completed">Completed</option> <option value="Closed">Closed</option> </select> <button id="addClientBtn">Add Client</button> <button id="saveBtn">Save</button> </div> <div class="pipeline"> <div class="stage" data-status="New"> <div class="stage-header"> <h2 class="wave-icon">New (<span id="countNew">0</span>) - <span id="totalNew">$0.00</span></h2> </div> <div class="dropzone"></div> </div> <div class="stage" data-status="Quoted"> <div class="stage-header"> <h2 class="wave-icon">Quoted (<span id="countQuoted">0</span>) - <span id="totalQuoted">$0.00</span></h2> </div> <div class="dropzone"></div> </div> <div class="stage" data-status="Scheduling"> <div class="stage-header"> <h2 class="wave-icon">Scheduling (<span id="countScheduling">0</span>) - <span id="totalScheduling">$0.00</span></h2> </div> <div class="dropzone"></div> </div> <div class="stage" data-status="Scheduled"> <div class="stage-header"> <h2 class="wave-icon">Scheduled (<span id="countScheduled">0</span>) - <span id="totalScheduled">$0.00</span></h2> </div> <div class="dropzone"></div> </div> <div class="stage" data-status="Completed"> <div class="stage-header"> <h2 class="wave-icon">Completed (<span id="countCompleted">0</span>) - <span id="totalCompleted">$0.00</span></h2> </div> <div class="dropzone"></div> </div> <div class="stage" data-status="Closed"> <div class="stage-header"> <h2 class="wave-icon">Closed (<span id="countClosed">0</span>) - <span id="totalClosed">$0.00</span></h2> </div> <div class="dropzone"></div> </div> </div> <div class="sidebar" id="sidebar"> <span class="close-btn">×</span> <div class="sidebar-header"> <span class="back-arrow">←</span> <h2>Client Details</h2> </div> <div id="sidebarContent"></div> </div> <script> let clients = JSON.parse(localStorage.getItem('clients')) || [ { firstName: "John", lastName: "Smith", boat: "Sea Ray 240", dateScheduled: "2025-04-15", service: "Full detailing and wax", notes: "Client prefers eco-friendly products", amount: 1200.00, datePaid: "", paymentMethod: "", status: "New", address: "123 Lake St, Minneapolis, MN", phone: "555-123-4567", email: "john.smith@email.com", other: "", photos: [] }, { firstName: "Emily", lastName: "Johnson", boat: "Chaparral 21 SSi", dateScheduled: "2025-04-20", service: "Interior cleaning", notes: "Focus on upholstery", amount: 800.00, datePaid: "", paymentMethod: "", status: "Quoted", address: "456 River Rd, St. Paul, MN", phone: "555-987-6543", email: "emily.j@email.com", other: "VIP client", photos: [] }, { firstName: "Michael", lastName: "Brown", boat: "Bayliner 185", dateScheduled: "2025-04-25", service: "Exterior wash and polish", notes: "Boat stored at marina", amount: 600.00, datePaid: "", paymentMethod: "", status: "Scheduled", address: "789 Marina Dr, Duluth, MN", phone: "555-456-7890", email: "michael.brown@email.com", other: "", photos: [] } ]; let selectedClientIndex = null; const stages = ["New", "Quoted", "Scheduling", "Scheduled", "Completed", "Closed"]; function formatCurrency(amount) { return `$${Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`; } function formatDate(dateStr) { if (!dateStr) return ''; const date = new Date(dateStr); if (isNaN(date)) return dateStr; return `${date.getDate().toString().padStart(2, '0')}/${(date.getMonth() + 1).toString().padStart(2, '0')}/${date.getFullYear()}`; } function parseDate(dateStr) { if (!dateStr) return ''; const [day, month, year] = dateStr.split('/'); return `${year}-${month}-${day}`; } function saveClients() { try { console.log('Save button clicked'); localStorage.setItem('clients', JSON.stringify(clients)); renderClients(); updateTotals(); if (selectedClientIndex !== null) renderSidebar(selectedClientIndex); } catch (e) { console.error('Save failed:', e); alert('Error saving clients: ' + e.message); } } function toggleInputForm() { try { console.log('Header Add Client button clicked'); const inputForm = document.getElementById('inputForm'); if (!inputForm) { console.error('Input form not found'); alert('Error: Input form not found'); return; } inputForm.style.display = inputForm.style.display === 'flex' ? 'none' : 'flex'; console.log('Form display set to:', inputForm.style.display); } catch (e) { console.error('Toggle form failed:', e); alert('Error toggling form: ' + e.message); } } function addClient() { try { console.log('Add Client button clicked'); const firstName = document.getElementById('firstName').value.trim(); const lastName = document.getElementById('lastName').value.trim(); const boat = document.getElementById('boat').value.trim(); const dateScheduled = document.getElementById('dateScheduled').value; const service = document.getElementById('service').value; const notes = document.getElementById('notes').value; const amount = parseFloat(document.getElementById('amount').value) || 0; const paymentMethod = document.getElementById('paymentMethod').value; const status = document.getElementById('status').value || 'New'; if (firstName && lastName && boat) { clients.push({ firstName, lastName, boat, dateScheduled: formatDate(dateScheduled), service, notes, amount, datePaid: '', paymentMethod, status, address: '', phone: '', email: '', other: '', photos: [] }); document.getElementById('firstName').value = ''; document.getElementById('lastName').value = ''; document.getElementById('boat').value = ''; document.getElementById('dateScheduled').value = ''; document.getElementById('service').value = ''; document.getElementById('notes').value = ''; document.getElementById('amount').value = ''; document.getElementById('paymentMethod').value = ''; document.getElementById('status').value = 'New'; saveClients(); toggleInputForm(); } else { console.log('Validation failed: Missing required fields'); alert('Please fill in First Name, Last Name, and Boat Make/Model.'); } } catch (e) { console.error('Add client failed:', e); alert('Error adding client: ' + e.message); } } function sortClients() { try { console.log('Sort by Name clicked'); clients.sort((a, b) => `${a.lastName} ${a.firstName}`.localeCompare(`${b.lastName} ${b.firstName}`)); saveClients(); } catch (e) { console.error('Sort failed:', e); } } function updateClient(index, field, value) { try { if (field === 'amount') value = parseFloat(value) || 0; if (field === 'dateScheduled' || field === 'datePaid') value = formatDate(value); clients[index][field] = value; saveClients(); } catch (e) { console.error('Update client failed:', e); } } function moveClient(index, direction) { try { const currentStageIndex = stages.indexOf(clients[index].status); let newStageIndex = direction === 'forward' ? currentStageIndex + 1 : currentStageIndex - 1; if (newStageIndex >= 0 && newStageIndex < stages.length) { clients[index].status = stages[newStageIndex]; saveClients(); } } catch (e) { console.error('Move client failed:', e); } } function renderClients() { try { const stages = document.querySelectorAll('.stage'); stages.forEach(stage => { const dropzone = stage.querySelector('.dropzone'); dropzone.innerHTML = ''; const status = stage.dataset.status; clients.filter(client => client.status === status).forEach((client, index) => { const globalIndex = clients.findIndex(c => c.firstName === client.firstName && c.lastName === client.lastName && c.boat === client.boat); const card = document.createElement('div'); card.className = 'card'; card.dataset.index = globalIndex; const isFirstStage = status === 'New'; const isLastStage = status === 'Closed'; card.innerHTML = ` <h3>${client.boat}</h3> <p class="amount">${formatCurrency(client.amount)}</p> <div class="card-actions"> <button ${isFirstStage ? 'disabled' : ''}>←</button> <button ${isLastStage ? 'disabled' : ''}>→</button> </div> `; card.querySelector('h3').addEventListener('click', () => openSidebar(globalIndex)); card.querySelectorAll('.card-actions button')[0].addEventListener('click', () => moveClient(globalIndex, 'backward')); card.querySelectorAll('.card-actions button')[1].addEventListener('click', () => moveClient(globalIndex, 'forward')); dropzone.appendChild(card); }); }); } catch (e) { console.error('Render clients failed:', e); } } function updateTotals() { try { const counts = { New: 0, Quoted: 0, Scheduling: 0, Scheduled: 0, Completed: 0, Closed: 0 }; const totals = { New: 0, Quoted: 0, Scheduling: 0, Scheduled: 0, Completed: 0, Closed: 0 }; let pipelineTotal = 0; clients.forEach(client => { counts[client.status]++; totals[client.status] += parseFloat(client.amount) || 0; if (["Scheduling", "Scheduled", "Completed"].includes(client.status)) { pipelineTotal += parseFloat(client.amount) || 0; } }); document.getElementById('countNew').textContent = counts.New; document.getElementById('countQuoted').textContent = counts.Quoted; document.getElementById('countScheduling').textContent = counts.Scheduling; document.getElementById('countScheduled').textContent = counts.Scheduled; document.getElementById('countCompleted').textContent = counts.Completed; document.getElementById('countClosed').textContent = counts.Closed; document.getElementById('totalNew').textContent = formatCurrency(totals.New); document.getElementById('totalQuoted').textContent = formatCurrency(totals.Quoted); document.getElementById('totalScheduling').textContent = formatCurrency(totals.Scheduling); document.getElementById('totalScheduled').textContent = formatCurrency(totals.Scheduled); document.getElementById('totalCompleted').textContent = formatCurrency(totals.Completed); document.getElementById('totalClosed').textContent = formatCurrency(totals.Closed); document.getElementById('totalPipeline').textContent = formatCurrency(pipelineTotal); } catch (e) { console.error('Update totals failed:', e); } } function deleteClient(index) { try { clients.splice(index, 1); saveClients(); closeSidebar(); } catch (e) { console.error('Delete client failed:', e); } } function openSidebar(index) { try { selectedClientIndex = index; const sidebar = document.getElementById('sidebar'); sidebar.classList.remove('closing'); sidebar.classList.add('open'); renderSidebar(index); } catch (e) { console.error('Open sidebar failed:', e); } } function closeSidebar() { try { const sidebar = document.getElementById('sidebar'); sidebar.classList.remove('open'); sidebar.classList.add('closing'); setTimeout(() => { if (!sidebar.classList.contains('open')) { sidebar.style.display = 'none'; } }, 300); selectedClientIndex = null; } catch (e) { console.error('Close sidebar failed:', e); } } function addPhoto(index, file) { try { const reader = new FileReader(); reader.onload = function(e) { if (!clients[index].photos) clients[index].photos = []; clients[index].photos.push(e.target.result); saveClients(); }; reader.readAsDataURL(file); } catch (e) { console.error('Add photo failed:', e); } } function deletePhoto(index, photoIndex) { try { clients[index].photos.splice(photoIndex, 1); saveClients(); } catch (e) { console.error('Delete photo failed:', e); } } function renderSidebar(index) { try { const client = clients[index]; const photos = client.photos || []; const sidebarContent = document.getElementById('sidebarContent'); sidebarContent.innerHTML = ` <button>Delete Client</button> <strong>First Name:</strong><br> <input type="text" value="${client.firstName || ''}"><br> <strong>Last Name:</strong><br> <input type="text" value="${client.lastName || ''}"><br> <strong>Boat Make/Model:</strong><br> <input type="text" value="${client.boat || ''}"><br> <strong>Date Scheduled:</strong><br> <input type="date" value="${parseDate(client.dateScheduled)}"><br> <strong>Service Requested/Performed:</strong><br> <textarea placeholder="Service">${client.service || ''}</textarea><br>
<strong>General Notes:</strong><br>

<textarea placeholder="Notes">${client.notes || ''}</textarea><br>
<strong>Amount:</strong><br>
<span>$</span><input type="number" value="${client.amount || 0}" step="0.01" min="0"><br>
<strong>Date Paid:</strong><br>
<input type="date" value="${parseDate(client.datePaid)}"><br>
<strong>Method of Payment:</strong><br>
<select>

<option value="" ${client.paymentMethod === '' ? 'selected' : ''}>Select Method</option> <option value="Cash" ${client.paymentMethod === 'Cash' ? 'selected' : ''}>Cash</option> <option value="Credit Card" ${client.paymentMethod === 'Credit Card' ? 'selected' : ''}>Credit Card</option> <option value="Check" ${client.paymentMethod === 'Check' ? 'selected' : ''}>Check</option> <option value="Online" ${client.paymentMethod === 'Online' ? 'selected' : ''}>Online</option> </select><br> <strong>Address:</strong><br> <textarea placeholder="Address">${client.address || ''}</textarea><br> <strong>Phone Number:</strong><br> <input type="tel" value="${client.phone || ''}"><br> <strong>Email:</strong><br> <input type="email" value="${client.email || ''}"><br> <strong>Other:</strong><br> <textarea placeholder="Other Details">${client.other || ''}</textarea><br> <strong>Photos:</strong><br> <input type="file" accept="image/*"><br> <div class="photo-gallery"> ${photos.map((photo, photoIndex) => ` <div> <img src="${photo}" alt="Client Photo"> <button>Delete</button> </div> `).join('')} </div> `; sidebarContent.querySelector('button').addEventListener('click', () => deleteClient(index)); sidebarContent.querySelectorAll('input, textarea, select').forEach(element => { if (element.tagName === 'INPUT' && element.type === 'file') { element.addEventListener('change', () => addPhoto(index, element.files[0])); } else if (element.tagName === 'SELECT' && element.querySelector('option[value=""]')) { element.addEventListener('change', () => updateClient(index, 'paymentMethod', element.value)); } else if (element.tagName === 'INPUT' && element.type === 'date' && element.previousElementSibling.textContent.includes('Date Scheduled')) { element.addEventListener('blur', () => updateClient(index, 'dateScheduled', element.value)); } else if (element.tagName === 'INPUT' && element.type === 'date' && element.previousElementSibling.textContent.includes('Date Paid')) { element.addEventListener('blur', () => updateClient(index, 'datePaid', element.value)); } else if (element.tagName === 'INPUT' && element.type === 'number') { element.addEventListener('blur', () => updateClient(index, 'amount', element.value)); } else if (element.tagName === 'INPUT' && element.type === 'text' && element.previousElementSibling.textContent.includes('First Name')) { element.addEventListener('blur', () => updateClient(index, 'firstName', element.value)); } else if (element.tagName === 'INPUT' && element.type === 'text' && element.previousElementSibling.textContent.includes('Last Name')) { element.addEventListener('blur', () => updateClient(index, 'lastName', element.value)); } else if (element.tagName === 'INPUT' && element.type === 'text' && element.previousElementSibling.textContent.includes('Boat')) { element.addEventListener('blur', () => updateClient(index, 'boat', element.value)); } else if (element.tagName === 'INPUT' && element.type === 'tel') { element.addEventListener('blur', () => updateClient(index, 'phone', element.value)); } else if (element.tagName === 'INPUT' && element.type === 'email') { element.addEventListener('blur', () => updateClient(index, 'email', element.value)); } else if (element.tagName === 'TEXTAREA' && element.placeholder === 'Service') { element.addEventListener('blur', () => updateClient(index, 'service', element.value)); } else if (element.tagName === 'TEXTAREA' && element.placeholder === 'Notes') { element.addEventListener('blur', () => updateClient(index, 'notes', element.value)); } else if (element.tagName === 'TEXTAREA' && element.placeholder === 'Address') { element.addEventListener('blur', () => updateClient(index, 'address', element.value)); } else if (element.tagName === 'TEXTAREA' && element.placeholder === 'Other Details') { element.addEventListener('blur', () => updateClient(index, 'other', element.value)); } }); sidebarContent.querySelectorAll('.photo-gallery button').forEach((btn, photoIndex) => { btn.addEventListener('click', () => deletePhoto(index, photoIndex)); }); } catch (e) { console.error('Render sidebar failed:', e); } }
const pipeline = document.querySelector('.pipeline');
pipeline.addEventListener('scroll', () => {
try {
const scrollPosition = pipeline.scrollLeft;
document.body.style.backgroundPositionX = -${scrollPosition * 0.2}px;
} catch (e) {

}
});

// Initialize
document.addEventListener('DOMContentLoaded', () => {
console.log('DOM loaded - initializing');
try {
const inputForm = document.getElementById('inputForm');
if (inputForm) {
inputForm.style.display = 'none';
console.log('Input form hidden');
} else {
console.error('Input form not found on load');
}

const headerBtn = document.getElementById('addClientHeaderBtn');
if (headerBtn) {
headerBtn.addEventListener('click', toggleInputForm);
console.log('Header button listener added');
} else {
console.error('Header button not found');
}

const addClientBtn = document.getElementById('addClientBtn');
if (addClientBtn) {
addClientBtn.addEventListener('click', addClient);
console.log('Add Client button listener added');
} else {
console.error('Add Client button not found');
}

const saveBtn = document.getElementById('saveBtn');
if (saveBtn) {
saveBtn.addEventListener('click', saveClients);
console.log('Save button listener added');
} else {
console.error('Save button not found');
}

const sortBtn = document.querySelector('.sort-btn');
if (sortBtn) {
sortBtn.addEventListener('click', sortClients);
console.log('Sort button listener added');
}

const closeSidebarBtn = document.querySelector('.close-btn');
if (closeSidebarBtn) {
closeSidebarBtn.addEventListener('click', closeSidebar);
console.log('Close sidebar button listener added');
}

const backArrow = document.querySelector('.back-arrow');
if (backArrow) {
backArrow.addEventListener('click', closeSidebar);
console.log('Back arrow listener added');
}

renderClients();
updateTotals();
} catch (e) {
console.error('Initialization failed:', e);
alert('Error initializing: ' + e.message);
}
});
</script>
