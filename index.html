e = ''; saveClients(); toggleInputForm(); } else { alert('First Name, Last Name, and Boat Make/Model are required!'); } } function sortClients() { clients.sort((a, b) => `${a.lastName} ${a.firstName}`.localeCompare(`${b.lastName} ${b.firstName}`)); saveClients(); } function updateClient(index, field, value) { if (field === 'amount') value = parseFloat(value) || 0; if (field === 'dateScheduled' || field === 'datePaid') value = formatDate(value); clients[index][field] = value; saveClients(); } function moveClient(index, direction) { const currentStageIndex = stages.indexOf(clients[index].status); let newStageIndex = direction === 'forward' ? currentStageIndex + 1 : currentStageIndex - 1; if (newStageIndex >= 0 && newStageIndex < stages.length) { clients[index].status = stages[newStageIndex]; saveClients(); } } function renderClients() { const stages = document.querySelectorAll('.stage'); stages.forEach(stage => { const dropzone = stage.querySelector('.dropzone'); dropzone.innerHTML = ''; const status = stage.dataset.status; clients.filter(client => client.status === status).forEach((client, index) => { const globalIndex = clients.findIndex(c => c.firstName === client.firstName && c.lastName === client.lastName && c.boat === client.boat); const card = document.createElement('div'); card.className = 'card'; card.dataset.index = globalIndex; const isFirstStage = status === 'New'; const isLastStage = status === 'Closed'; card.innerHTML = ` <h3 onclick="openSidebar(${globalIndex})">${client.boat}</h3> <p class="amount">${formatCurrency(client.amount)}</p> <div class="card-actions"> <button onclick="moveClient(${globalIndex}, 'backward')" ${isFirstStage ? 'disabled' : ''}>←</button> <button onclick="moveClient(${globalIndex}, 'forward')" ${isLastStage ? 'disabled' : ''}>→</button> </div> `; dropzone.appendChild(card); }); }); } function updateTotals() { const counts = { New: 0, Quoted: 0, Scheduled: 0, Completed: 0, Closed: 0 }; const totals = { New: 0, Quoted: 0, Scheduled
